<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KernMind</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="logo-box" style="padding: 0; overflow: hidden; background: transparent;">
          <img src="icons/icon48.png" alt="KernMind" style="width: 20px; height: 20px; object-fit: contain; border-radius: 6px;">
        </div>
        <span class="brand-name">KernMind</span>
      </div>
      <div class="header-actions">
        <a href="http://localhost:3000" target="_blank" class="icon-btn" title="Open Mind Dashboard">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
        <a href="options.html" target="_blank" class="icon-btn" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
      </div>
    </div>

    <!-- Active Tab Quick Save Card -->
    <div class="active-tab-preview" id="tab-preview">
      <div class="tab-info">
        <img id="tab-favicon" class="favicon" src="" alt="">
        <div class="tab-text">
          <div id="tab-title" class="tab-title">Loading current page...</div>
          <div id="tab-url" class="tab-url">...</div>
        </div>
      </div>
      <button id="btn-save-page" class="primary-btn">
        <span>Save Page</span>
      </button>
    </div>

    <!-- Quick Note / Drop Area -->
    <div class="note-section">
      <textarea id="quick-note" placeholder="Write a note, quote, or paste content..." rows="3"></textarea>
      <div class="note-actions">
        <div style="display: flex; gap: 4px;">
          <button id="btn-checklist" class="tool-btn" title="Add task checklist item">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span class="tool-label">Checklist</span>
          </button>
          <button id="btn-eyedropper" class="tool-btn" title="Pick Color on Screen">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="m2 5 5 5"/></svg>
            <span class="tool-label">Color</span>
          </button>
        </div>
        <button id="btn-save-note" class="secondary-btn">Save Note</button>
      </div>
    </div>

    <!-- Status / Toast inside popup -->
    <div id="popup-status" class="popup-status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
