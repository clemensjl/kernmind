<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenMind Quick Capture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: rgba(28, 25, 23, 0.95);
      backdrop-filter: blur(20px);
      -webkit-app-region: drag;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      color: #FAFAFA;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #E07A5F;
    }
    .hint {
      font-size: 10px;
      color: #A1A1AA;
      font-family: monospace;
    }
    textarea {
      -webkit-app-region: no-drag;
      width: 100%;
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      padding: 8px 0;
      font-family: inherit;
    }
    textarea::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    .footer {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .status {
      font-size: 11px;
      color: #34D399;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    button {
      padding: 6px 14px;
      border-radius: 10px;
      border: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button.primary {
      background-color: #E07A5F;
      color: white;
    }
    button.primary:hover { opacity: 0.9; }
    button.secondary {
      background-color: rgba(255, 255, 255, 0.1);
      color: #E4E4E7;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>🧠</span>
      <span>OpenMind Capture</span>
    </div>
    <div class="hint">Press Esc to close</div>
  </div>

  <textarea id="capture-input" placeholder="Type a note, thought, quote, or paste any URL..." autofocus></textarea>

  <div class="footer">
    <div id="status-msg" class="status"></div>
    <div class="actions">
      <button class="secondary" id="btn-cancel">Cancel</button>
      <button class="primary" id="btn-submit">Remember (Enter)</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('capture-input');
    const statusMsg = document.getElementById('status-msg');
    const SERVER_URL = 'http://localhost:3000';

    async function submitCapture() {
      const text = input.value.trim();
      if (!text) return;

      statusMsg.textContent = 'Saving...';

      const isUrl = text.startsWith('http://') || text.startsWith('https://');
      const isColor = text.startsWith('#') && (text.length === 4 || text.length === 7);
      const isQuote = text.startsWith('“') || text.startsWith('"');

      let payload = { text };
      if (isUrl) payload = { url: text };
      else if (isColor) payload = { type: 'color', text, colors: [text.toUpperCase()] };
      else if (isQuote) payload = { type: 'quote', text };
      else payload = { type: 'note', text };

      try {
        const res = await fetch(`${SERVER_URL}/api/capture`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          statusMsg.textContent = '✓ Saved to your Mind!';
          input.value = '';
          setTimeout(() => {
            window.close();
          }, 800);
        } else {
          statusMsg.textContent = 'Error saving';
        }
      } catch (err) {
        statusMsg.textContent = 'Server offline (Start Web App)';
      }
    }

    document.getElementById('btn-submit').addEventListener('click', submitCapture);
    document.getElementById('btn-cancel').addEventListener('click', () => window.close());

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.close();
      } else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey || !e.shiftKey)) {
        e.preventDefault();
        submitCapture();
      }
    });
  </script>
</body>
</html>
