services:
  kernmind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kernmind-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      # Optional default API keys (can also be entered via BYOK settings UI):
      # - OPENAI_API_KEY=
      # - GEMINI_API_KEY=
      # - ANTHROPIC_API_KEY=
      # - GROQ_API_KEY=
      # - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - kernmind_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  kernmind_data:
    driver: local
